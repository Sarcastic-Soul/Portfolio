on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies (if not cached) 🔧
        run: pnpm install --frozen-lockfile

      - name: Clean conflicting config files 🧹
        run: |
          echo "Checking for config files:"
          ls -la next.config.*
          if [ -f "next.config.js" ]; then
            echo "Removing conflicting next.config.js file"
            rm next.config.js
          fi
          echo "Final config files:"
          ls -la next.config.*

      - name: Build with Next.js 🏗️
        run: pnpm build

      - name: Add .nojekyll file �
        run: |
          echo "Current working directory:"
          pwd
          echo "Contents of current directory:"
          ls -la
          echo "Creating .nojekyll file in out directory:"
          echo "" > ./out/.nojekyll
          echo "Verifying .nojekyll file was created:"
          ls -la ./out/.nojekyll

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4